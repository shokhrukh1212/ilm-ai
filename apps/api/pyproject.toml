[project]
name = "ilm-ai-api"
version = "0.1.0"
description = "FastAPI backend for Ilm AI"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "anthropic>=0.70,<1",
  "apscheduler>=3.10,<4",
  "asyncpg>=0.30,<1",
  "cohere>=5,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langfuse>=3,<4",
  "langdetect>=1.0.9,<2",
  "llama-index-core>=0.12,<1",
  "pgvector>=0.4,<1",
  "pydantic>=2,<3",
  "pydantic-ai>=1,<2",
  "pydantic-settings>=2,<3",
  "pypdf>=6,<7",
  "python-docx>=1,<2",
  "pyjwt[crypto]>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "python-telegram-bot==21.*",
  "sentry-sdk[fastapi]>=2,<3",
  "sqlalchemy>=2,<3",
  "stripe>=14,<15",
  "supabase>=2,<3",
  "sse-starlette>=2,<3",
  "uvicorn[standard]>=0.38,<1"
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10"
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
